name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the release workflow on its release pull request, which its own pushes can't trigger.
  workflow_dispatch:
  # Daily, the examples installed fresh from npm (the fresh-install job) and nothing else.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  # The daily run has a group of its own: a push to main doesn't cancel it, nor it the push's run.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-daily' || '' }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library
        run: pnpm build:lib

      - name: Bundle size, against each import's budget
        run: pnpm size

      - name: DiffReview on large files in Chrome, against each case's budget
        run: pnpm perf
        timeout-minutes: 10

      - name: Typecheck
        run: pnpm typecheck

      - name: Test, with coverage and its thresholds
        run: pnpm test:coverage

      - name: Site tests (code colours at 4.5:1 in both themes, the output grammar)
        run: pnpm test:site

      - name: Coverage in the job summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Package exports (publint, attw)
        run: pnpm --filter signoff-ui lint:package

      - name: styles.css in Chrome, next to a global reset and in a Tailwind v3 build
        run: pnpm smoke:styles

      - name: shadcn registry
        run: pnpm registry:build

      - name: Registry files under a new Next.js app's ESLint config, with no warnings
        run: pnpm lint:registry

      - name: Build playground
        run: pnpm build:playground

      - name: Playground in Chrome
        run: pnpm smoke:playground

      - name: Accessibility in Chrome (axe with real layout and contrast, dark and light)
        run: pnpm a11y

  ai-sdk-6:
    name: AI SDK 6
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Latest first: once 6.0.0 is installed, `pnpm add ai@^6` keeps it, since it satisfies ^6.
      - name: Install the latest and the oldest AI SDK 6 in turn, typecheck the library, run the tests
        working-directory: packages/signoff-ui
        run: |
          for version in ^6 6.0.0; do
            pnpm add --save-dev "ai@$version"
            node -e "console.log('ai', require('ai/package.json').version)"
            pnpm exec tsc --noEmit -p tsconfig.src.json
            pnpm test
          done

  react-18:
    name: React 18
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install React 18, typecheck the library, run the tests
        working-directory: packages/signoff-ui
        run: |
          pnpm add --save-dev react@^18.2.0 react-dom@^18.2.0 @types/react@^18 @types/react-dom@^18
          node -e "console.log('react', require('react/package.json').version)"
          pnpm exec tsc --noEmit -p tsconfig.src.json
          pnpm test

  nextjs-quickstart:
    name: Next.js quickstart
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      # cacheComponents is on: next build fails if a component reads the clock or a random number
      # while prerendering (app/static/page.tsx renders every component from a Server Component).
      - name: Build examples/nextjs-minimal
        run: pnpm --filter nextjs-minimal build

      - name: Run the quickstart in Chrome, approve the command, wait for the final answer
        run: pnpm smoke:nextjs

  assistant-ui:
    name: assistant-ui binding
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      # npm pack, then the example built against the tarball with Vite: what an app installs from npm.
      - name: Review and approve in the example from the packed package, in Chrome
        run: pnpm smoke:assistant-ui

  copilotkit:
    name: CopilotKit example
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      # cacheComponents is on, as in new Next.js apps: the build fails if CopilotKitProvider is not
      # inside a Suspense boundary (app/providers.tsx).
      - name: Build examples/copilotkit
        run: pnpm --filter copilotkit-example build

      # CopilotKit's hooks render the approval card, approval rules and DiffReview; an interrupt
      # through useInterrupt; and useAgUiAgent resuming through copilotkit.runAgent.
      - name: Approvals, a rule, a review and an interrupt in CopilotKit, in Chrome
        run: pnpm smoke:copilotkit

  coding-agent:
    name: Coding agent reference app
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Copied on its own, the example installs signoff-ui from npm at its range: it must include the
      # version this repository publishes. `pnpm version-packages` moves it with each release.
      - name: The example asks for the version this repository publishes
        run: pnpm examples:check

      - name: Build library
        run: pnpm build:lib

      # The whole scripted run through the route, the rules and the simulated commands; live mode
      # against a stub of the OpenAI provider, so no request leaves the runner.
      - name: Test examples/coding-agent
        run: pnpm --filter coding-agent test

      # npm pack, then a copy of the example built against the tarball with Next.js: what an app installs from npm.
      - name: Run the reference app from the packed package in Chrome, on a desktop and a phone
        run: pnpm smoke:coding-agent

  # The playground, axe and the quickstart in Playwright's WebKit, Safari's engine, on a Mac, where it
  # behaves as Safari and iOS do: a click on a button doesn't focus it.
  webkit:
    name: WebKit (Safari's engine)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install WebKit
        run: pnpm exec playwright-core install webkit

      - name: Build library, registry and playground
        run: pnpm build:lib && pnpm registry:build && pnpm build:playground

      - name: Playground in WebKit, with focus after a click on the review's controls
        run: pnpm smoke:playground
        env:
          BROWSER: webkit

      - name: Accessibility in WebKit
        run: pnpm a11y
        env:
          BROWSER: webkit

      - name: Build examples/nextjs-minimal
        run: pnpm --filter nextjs-minimal build

      - name: Run the quickstart in WebKit
        run: pnpm smoke:nextjs
        env:
          BROWSER: webkit

  firefox:
    name: Firefox
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Firefox
        run: pnpm exec playwright-core install --with-deps firefox

      - name: Build library, registry and playground
        run: pnpm build:lib && pnpm registry:build && pnpm build:playground

      - name: Playground in Firefox
        run: pnpm smoke:playground
        env:
          BROWSER: firefox

      - name: Build examples/nextjs-minimal
        run: pnpm --filter nextjs-minimal build

      - name: Run the quickstart in Firefox
        run: pnpm smoke:nextjs
        env:
          BROWSER: firefox

  # The examples as someone outside this repository runs them: copied out, installed from the
  # registry with no lockfile, and started with `dev`. Daily with signoff-ui from npm; on the version
  # pull request (and any run started by hand) with the package it is about to publish.
  fresh-install:
    name: Examples installed fresh from npm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        if: github.event_name != 'schedule'
        run: pnpm build:lib

      - name: Each example installed from npm, run with dev in Chrome, typechecked
        run: pnpm smoke:fresh-install ${{ github.event_name != 'schedule' && '--pack' || '' }}
