packages:
  - packages/*
  - examples/*
# The examples ask for the published package (`latest`, or `^<version>` in examples/coding-agent),
# so they also run copied out of the repository; in the workspace they build against the local source.
overrides:
  'signoff-ui': 'workspace:*'
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  unrs-resolver: false
