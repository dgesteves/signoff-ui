packages:
  - packages/*
  - examples/*
# The examples ask for the published package (`^<version>`, which `pnpm version-packages` moves with each
# release), so they also run copied out of the repository; in the workspace they build against the local source.
overrides:
  # High: follow-redirects 1.16.0-1.16.1 drop cross-realm sensitiveHeaders on redirect (fixed in 1.16.2),
  # through examples/copilotkit (@copilotkit/runtime > @slack/bolt > @slack/web-api > axios).
  'follow-redirects@<1.16.2': ^1.16.2
  'signoff-ui': 'workspace:*'
  # @copilotkit/runtime (examples/copilotkit) reaches @ai-sdk/provider-utils 3, which asks for undici ^5.29.0.
  # undici 5 has advisories fixed only in 6.28.1 and later. provider-utils 3 uses undici's Agent and fetch,
  # the same calls provider-utils 4 makes with undici ^6.28.0, so it gets undici 6 here.
  '@ai-sdk/provider-utils@3>undici': ^6.28.1
# `pnpm audit` (ci.yml for the production dependencies, audit.yml for all of them) skips these advisories: no
# release fixes them within the range the packages that bring them ask for. Remove one once a release does.
auditConfig:
  ignoreGhsas:
    # zod (high): memory exhaustion validating oversized constrained collections, fixed only in zod 4.6.6. The
    # published signoff-ui package doesn't depend on zod, the registry items reach it only as ai's peer (the app's
    # own zod), and the examples that use zod ask for ^4.6.7. zod 3 comes only through @ag-ui/client and
    # @ag-ui/proto, in signoff-ui's dev dependencies and in the site, where they run only in the browser, on the
    # components page's scripted AG-UI run; and, in examples/copilotkit, through those and @copilotkit/runtime,
    # @copilotkit/shared, @copilotkit/a2ui-renderer and @a2ui/web_core, which its API route loads when you run the
    # example. No route of the site loads zod 3. The latest @ag-ui/client (1.0.3) and @copilotkit/runtime (1.82.0)
    # still ask for zod 3: remove this when they move to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # katex (low): prototype pollution already in the page can bypass its `trust` option, fixed in 0.18.2.
    # Only examples/copilotkit has it: @copilotkit/react-core (1.82.0 too) and the streamdown, mermaid and
    # math plugins it brings all ask for katex ^0.16.
    - GHSA-238p-pmpm-9mq7
    # deepmerge (low): mergeObject() allows prototype poisoning of the objects it returns. Only the shadcn CLI
    # brings it, itself and through @shadcn/registry: a root dev dependency that builds the registry from this
    # repository's own files (pnpm registry:build). It is never shipped and never runs on untrusted input. No
    # deepmerge release fixes it (4.3.1, the latest, is affected), and shadcn 4.23.0, the latest, still asks for
    # ^4.3.1: remove this when shadcn drops deepmerge or a fixed release exists.
    - GHSA-gcqx-w48m-w2h4
    # graphql-scalars (high): the PhoneNumber scalar's pattern takes very long on crafted input, fixed only in
    # 2.0.1. Only examples/copilotkit has it: @copilotkit/runtime (1.82.0 too) asks for ^1.23.0, and type-graphql
    # 2.0.0-rc.1, which it pins, for ^1.22.4. They use only its JSON, JSONObject, Timestamp and DateTimeISO
    # scalars, never PhoneNumber: remove this when both move to graphql-scalars 2.
    - GHSA-x8rm-f576-gq67
    # @hono/node-server (moderate): serveStatic decodes the request path twice, so a middleware on static paths
    # can be bypassed. Every release from 1.19.10 on is affected until 2.1.3. Only examples/copilotkit has an
    # affected one: @copilotkit/runtime (1.82.0 too) lists ^1.13.5 but never imports it, and the example serves
    # through Next.js. Remove this when @copilotkit/runtime moves to 2.1.3 or later.
    - GHSA-rmxm-3fg6-px4f
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  unrs-resolver: false
